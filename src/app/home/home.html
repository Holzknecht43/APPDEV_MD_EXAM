<div class="container">
  <h1 class="title">🌤️ Current Weather</h1>

  <form (ngSubmit)="getWeather()">
    <input
      [(ngModel)]="city"
      name="city"
      placeholder="Enter city name"
      class="input-field"
      required
    />
    <button type="submit" class="search-btn">Get Weather</button>
  </form>

  <div *ngIf="weatherData" class="weather-section">
    <h2>{{ weatherData.name }}, {{ weatherData.sys.country }}</h2>

    <div class="weather-details">
      <p><strong>Temperature:</strong> {{ weatherData.main.temp }} °C</p>
      <p><strong>Condition:</strong> {{ weatherData.weather[0].description | titlecase }}</p>
      <p><strong>Humidity:</strong> {{ weatherData.main.humidity }}%</p>
      <p><strong>Wind Speed:</strong> {{ weatherData.wind.speed }} m/s</p>
    </div>

    <div class="weather-icon">
      <img
        [src]="'https://openweathermap.org/img/wn/' + weatherData.weather[0].icon + '@2x.png'"
        alt="Weather icon"
      />
      <br />
      <button class="savebtn" (click)="saveCity()">Save City</button>
    </div>
  </div>


  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</div>
